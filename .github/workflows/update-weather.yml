name: Update weather data

on:
  schedule:
    # Daily at 05:17 UTC: extend the weekly NOAA OISST backfill and refresh
    # the Open-Meteo wind, wave and air-temperature snapshot.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore NOAA download cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: noaa-oisst-${{ runner.os }}-${{ hashFiles('scripts/fetch-current-weather.mjs') }}
          restore-keys: |
            noaa-oisst-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest sea-surface temperature and weather
        run: npm run fetch:weather

      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- src/assets/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No weather data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/data
          git commit -m "chore(data): daily sea temperature and weather update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so ask
      # the Pages workflow to rebuild with the fresh data explicitly.
      - name: Trigger GitHub Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
