name: Update weather data

on:
  schedule:
    # Daily at 05:17 UTC: extend the weekly NOAA OISST backfill and refresh
    # the Open-Meteo wind, wave and air-temperature snapshot.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # kmd-bot is a branch-protection bypass actor, so its short-lived token
      # can commit the daily data snapshot to main while human changes still
      # require a pull request.
      - name: Create kmd-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KMD_BOT_APP_ID }}
          private-key: ${{ secrets.KMD_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore NOAA download cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: noaa-oisst-${{ runner.os }}-${{ hashFiles('scripts/fetch-current-weather.mjs') }}
          restore-keys: |
            noaa-oisst-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest sea-surface temperature and weather
        run: npm run fetch:weather

      - name: Commit updated data
        run: |
          if git diff --quiet -- src/assets/data; then
            echo "No weather data changes."
            exit 0
          fi
          git config user.name "kmd-bot[bot]"
          git config user.email "5387484+kmd-bot[bot]@users.noreply.github.com"
          git add src/assets/data
          git commit -m "chore(data): daily sea temperature and weather update"
          # Authenticated as kmd-bot, so this push triggers deploy.yml. A push
          # made with GITHUB_TOKEN would not start another workflow.
          git push
