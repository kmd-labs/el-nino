name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    # every 3 hours: also refreshes the live wind, wave & water-temperature snapshot for the "Current situation" view
    - cron: '0 */3 * * *'
  repository_dispatch:
    types: [design-system-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pull latest Design System changes
        run: git submodule update --remote --force src/design-system

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore NOAA download cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: noaa-oisst-${{ runner.os }}-${{ hashFiles('scripts/fetch-current-weather.mjs') }}
          restore-keys: |
            noaa-oisst-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Never fails the build: on an API error the committed snapshot is kept
      - name: Fetch current wind & waves (Open-Meteo) and sea surface temperature (NOAA OISST)
        run: npm run fetch:weather

      # Never fails the build: on an API error the committed record is kept
      - name: Fetch ENSO history and analog forecast (NOAA CPC)
        run: npm run fetch:history

      - name: Build Angular application for GitHub Pages
        run: npm run build:gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/el-nino/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
