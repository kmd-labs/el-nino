name: Sync Design System Submodule

on:
  schedule:
    # Run every 6 hours to check if kmd-labs/design-system was updated
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [design-system-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KMD_BOT_APP_ID }}
          private-key: ${{ secrets.KMD_BOT_PRIVATE_KEY }}

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Update design-system submodule to latest main
        run: |
          git submodule update --remote --force src/design-system

      - name: Create Pull Request with design-system updates
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(design-system): sync kmd-labs/design-system to latest"
          title: "chore(design-system): sync kmd-labs/design-system to latest"
          body: "Automated sync of `src/design-system` submodule from `kmd-labs/design-system`."
          branch: chore/sync-design-system
          delete-branch: true

      - name: Verify automated PR scope
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq .author.login)
          if [ "$HEAD_REF" != "chore/sync-design-system" ] || [ "$AUTHOR" != "app/kmd-bot" ]; then
            echo "::error::Refusing to auto-merge PR #$PR_NUMBER ($AUTHOR:$HEAD_REF); only automated design-system sync PRs are eligible."
            exit 1
          fi
          echo "Verified automated design-system sync PR #$PR_NUMBER at $PR_HEAD_SHA."

      - name: Auto-merge Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --admin --squash --delete-branch \
            --match-head-commit ${{ steps.cpr.outputs.pull-request-head-sha }}
