    <main style="max-width: 680px; margin: 0 auto; padding: 48px 20px; font: 16px/1.6 Inter, system-ui, sans-serif; color: #1e293b;">
      <h1>El Niño 2026 in 3D – interactive ENSO globe</h1>
      <p><strong>This visualisation needs JavaScript and WebGL.</strong> Please enable JavaScript to explore the globe.</p>
      <p>Watch El Niño and La Niña unfold on an interactive 3D globe. Real NOAA sea surface temperatures from November 2024 to today show the 2026 El Niño building up across the equatorial Pacific, with a forecast for December 2026.</p>
      <h2>What you can explore</h2>
      <ul>
        <li><strong>Water temperature and anomalies</strong> on the globe, with the Niño 3.4 region and the Indian Ocean Dipole, plus winds and waves.</li>
        <li><strong>The Walker circulation and the thermocline</strong> in a cross-section along the equator, step by step.</li>
        <li><strong>Impacts worldwide</strong>: where El Niño and La Niña bring droughts, fires and floods, with documented historical events and their sources.</li>
        <li>A glossary of key terms, in English, Polish and Spanish.</li>
      </ul>
      <h2>Data sources</h2>
      <p>NOAA OISST v2.1 sea surface temperatures, Open-Meteo weather, the NOAA CPC ENSO outlook, and rainfall impact maps from WMO, the EU Joint Research Centre and the JMA Tokyo Climate Center.</p>
      <p>Made by KMD Labs – <a href="?page=about">meet the team</a>.</p>
    </main>
