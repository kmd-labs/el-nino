<app-splash-host></app-splash-host>

<main class="app-main" [attr.inert]="page.about() ? '' : null">
  <app-globe></app-globe>
  <app-header></app-header>
  @if (state.view() === 'walker') {
    <app-walker-view></app-walker-view>
  }
  <app-map-dock></app-map-dock>
  <app-popup [closeAriaLabel]="i18n.t().close"></app-popup>
  <app-tooltip></app-tooltip>
</main>

@if (page.about()) {
  <app-about-page></app-about-page>
}
