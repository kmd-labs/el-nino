@let t = i18n.t();

<header class="header">
  <div class="header__left">
    <!-- 1. Brand / Logotype Container -->
    <div class="header__brand glass-panel">
      <button
        type="button"
        class="header__logo"
        [attr.aria-label]="t.about.openAbout"
        [appTooltip]="t.about.openAbout"
        (click)="page.openAbout()">
        <img
          class="header__logo-img"
          src="assets/design-system/logo/kmd-black-orange.svg"
          alt="" />
      </button>
      <span class="header__divider" aria-hidden="true"></span>
      <h1 class="header__app-name">El Niño</h1>
    </div>

    <!-- 2. Language Selector Container -->
    <div class="header__settings glass-panel" role="group" [attr.aria-label]="t.changeLanguage">
      <app-dropdown
        variant="ghost"
        [icon]="bp.mobile() ? null : globeIcon"
        [options]="langOptions()"
        [value]="i18n.lang()"
        [ariaLabel]="t.changeLanguage"
        (valueChange)="onLangChange($event)">
      </app-dropdown>
    </div>

    <!-- 3. Call to action: opens the About page -->
    @if (showCta()) {
      <div class="header__cta glass-panel">
        <app-button variant="ghost" (btnClick)="page.openAbout()">
          <lucide-icon class="header__cta-icon" [img]="ctaIcon" [size]="15"></lucide-icon>
          <span>{{ t.about.cta }}</span>
        </app-button>
      </div>
    }

    @if (!state.mapLoaded()) {
      <div class="header__loading glass-panel" [class.header__loading--error]="state.mapError()">
        {{ state.mapError() ? t.mapError : t.loadingMap }}
      </div>
    }
  </div>

  <!-- 3. Standalone View / Anomaly Mode Dropdown -->
  <div class="header__right">
    <div #sharePill class="header__share glass-panel">
      <app-dropdown
        variant="ghost"
        align="right"
        [iconOnly]="true"
        [icon]="copied() ? checkIcon : shareIcon"
        [options]="shareOptions()"
        [ariaLabel]="t.shareLink"
        (valueChange)="onShare($event)">
      </app-dropdown>
    </div>
    <div class="header__view glass-panel">
      <app-dropdown
        variant="ghost"
        align="right"
        [fullWidth]="true"
        [options]="viewOptions()"
        [value]="currentView()"
        [icon]="currentViewIcon()"
        [ariaLabel]="t.chooseView"
        (valueChange)="onViewChange($event)">
      </app-dropdown>
    </div>
  </div>
</header>
