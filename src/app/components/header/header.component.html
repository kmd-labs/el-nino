@let t = i18n.t();

<header class="header">
  <div class="header__left">
    <!-- 1. Brand / Logotype Container -->
    <div class="header__brand glass-panel">
      <div class="header__logo" aria-label="KMD">
        <span class="header__logo-mark">KMD</span>
      </div>
      <span class="header__divider" aria-hidden="true"></span>
      <h1 class="header__app-name">El Niño</h1>
    </div>

    <!-- 2. Settings Container (Language Dropdown + Light/Dark Theme Switcher) -->
    <div class="header__settings glass-panel" role="group" [attr.aria-label]="t.changeLanguage">
      <app-dropdown
        variant="ghost"
        [icon]="bp.mobile() ? null : globeIcon"
        [options]="langOptions()"
        [value]="i18n.lang()"
        [ariaLabel]="t.changeLanguage"
        (valueChange)="onLangChange($event)">
      </app-dropdown>

      <span class="header__divider" aria-hidden="true"></span>

      <app-button
        variant="ghost"
        [iconOnly]="true"
        [ariaLabel]="t.toggleTheme"
        [titleText]="theme.theme() === 'dark' ? t.themeLight : t.themeDark"
        (btnClick)="theme.toggleTheme()">
        @if (theme.theme() === 'dark') {
          <lucide-icon [img]="sunIcon" [size]="15"></lucide-icon>
        } @else {
          <lucide-icon [img]="moonIcon" [size]="15"></lucide-icon>
        }
      </app-button>
    </div>


    @if (!state.mapLoaded()) {
      <div class="header__loading glass-panel" [class.header__loading--error]="state.mapError()">
        {{ state.mapError() ? t.mapError : t.loadingMap }}
      </div>
    }
  </div>

  <!-- 4. Merged Niño 3.4 Anomaly Readout, Scale Bar & Impacts/Pins Legend -->
  <div class="header__right">
    <app-legend-panel></app-legend-panel>
  </div>
</header>
