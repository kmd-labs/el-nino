@let t = i18n.t();

<header class="header" [class.header--popup-open]="isPopupOpen()">
  <div class="header__left">
    <!-- 1. Brand Pill: Logo & Contact CTA -->
    <div class="header__brand-wrap">
      <div
        class="header__brand glass-panel"
        [class.header__brand--expanded]="isBrandExpanded()"
        (mouseenter)="onBrandHover(true)"
        (mouseleave)="onBrandHover(false)"
        (click)="onBrandClick($event)">
        <button
          type="button"
          class="header__brand-btn"
          [attr.aria-label]="t.about.openAbout + ' – ' + t.about.cta">
          <span class="header__logo">
            <img
              class="header__logo-img"
              src="assets/design-system/logo/kmd-black-orange.svg"
              alt="KMD"
              width="40"
              height="16" />
          </span>

          <span class="header__brand-expand">
            <span class="header__divider" aria-hidden="true"></span>
            <span class="header__cta">
              <lucide-icon class="header__cta-icon" [img]="ctaIcon" [size]="14"></lucide-icon>
              <span class="header__cta-text">{{ t.about.cta }}</span>
            </span>
          </span>
        </button>
      </div>
    </div>

    <!-- 2. Actions: Standalone Share & Settings Buttons -->
    <div class="header__actions">
      <div class="header__share glass-panel">
        <app-button
          variant="ghost"
          [iconOnly]="true"
          [ariaLabel]="t.shareLink"
          [titleText]="t.shareLink"
          (btnClick)="openSharePopup()">
          <lucide-icon [img]="shareIcon" [size]="15"></lucide-icon>
        </app-button>
      </div>

      <div class="header__settings glass-panel">
        <app-button
          variant="ghost"
          [iconOnly]="true"
          [ariaLabel]="t.settingsAria"
          [titleText]="t.settingsAria"
          (btnClick)="openSettings()">
          <lucide-icon [img]="settingsIcon" [size]="15"></lucide-icon>
        </app-button>
      </div>
    </div>

    @if (!state.mapLoaded()) {
      <div class="header__loading glass-panel" [class.header__loading--error]="state.mapError()">
        {{ state.mapError() ? t.mapError : t.loadingMap }}
      </div>
    }
  </div>

  <!-- 3. Standalone View / Anomaly Mode Dropdown -->
  <div class="header__right">
    <div class="header__view glass-panel">
      <app-dropdown
        variant="ghost"
        align="right"
        [fullWidth]="true"
        [options]="viewOptions()"
        [value]="currentView()"
        [icon]="currentViewIcon()"
        [ariaLabel]="t.chooseView"
        (valueChange)="onViewChange($event)">
      </app-dropdown>
    </div>
  </div>
</header>
