@let t = i18n.t();

<header class="header">
  <div class="header__left">
    <!-- 1. Brand / Logotype Container -->
    <div class="header__brand glass-panel">
      <div class="header__logo" aria-label="KMD">
        <span class="header__logo-mark">KMD</span>
      </div>
      <span class="header__divider" aria-hidden="true"></span>
      <h1 class="header__app-name">El Niño</h1>
    </div>

    <!-- 2. Language Selector Container -->
    <div class="header__settings glass-panel" role="group" [attr.aria-label]="t.changeLanguage">
      <app-dropdown
        variant="ghost"
        [icon]="bp.mobile() ? null : globeIcon"
        [options]="langOptions()"
        [value]="i18n.lang()"
        [ariaLabel]="t.changeLanguage"
        (valueChange)="onLangChange($event)">
      </app-dropdown>
    </div>


    @if (!state.mapLoaded()) {
      <div class="header__loading glass-panel" [class.header__loading--error]="state.mapError()">
        {{ state.mapError() ? t.mapError : t.loadingMap }}
      </div>
    }
  </div>

  <!-- 3. Standalone View / Anomaly Mode Dropdown -->
  <div class="header__right">
    <div class="header__view glass-panel">
      <app-dropdown
        variant="ghost"
        align="right"
        [fullWidth]="true"
        [options]="viewOptions()"
        [value]="currentView()"
        [icon]="currentViewIcon()"
        [ariaLabel]="t.chooseView"
        (valueChange)="onViewChange($event)">
      </app-dropdown>
    </div>
  </div>
</header>
