@let t = i18n.t();
<section class="thermo" [attr.aria-label]="t.thermoAria">
  <div class="thermo__step glass-panel" aria-live="polite">
    <app-badge [text]="state.category().name" [backgroundColor]="state.category().col"></app-badge>
    <span class="thermo__val">Niño 3.4: {{ formattedNino() }}</span>
    <span class="thermo__title">{{ state.description() }}</span>
  </div>

  <div #box class="thermo__box">
    <canvas #cv></canvas>
  </div>

  <div class="thermo__foot">
    <p class="thermo__note">{{ t.thermoTitle }} — {{ t.thermoNote }}</p>
    <div class="thermo__prob" [title]="t.probTitle">
      <span>{{ t.probText }} <strong>{{ state.prob2026() }}</strong></span>
      <a
        href="https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml"
        target="_blank"
        rel="noopener noreferrer">
        <span>{{ t.probSource }}</span>
        <lucide-icon [img]="externalLinkIcon" [size]="12"></lucide-icon>
      </a>
    </div>
  </div>
</section>
