@let t = i18n.t();

<div #wrap class="dock-wrap">
  @if (state.monthText()) {
    <div class="cycle-pill glass-panel">
      <span>{{ state.monthText() }}</span>
    </div>
  }

  <div class="dock glass-panel">
    <!-- Row 1: View Switcher -->
    <div class="dock__row dock__row--views" role="group" [attr.aria-label]="t.chooseView">
      <app-button
        [ariaLabel]="t.viewTemp"
        [titleText]="t.viewTemp"
        variant="toggle"
        [active]="state.view() === 'globe' && state.displayMode() === 'sst'"
        (btnClick)="onModeClick('sst')">
        <lucide-icon [img]="thermometerIcon" [size]="14"></lucide-icon>
        <span class="dock__label">{{ t.viewTemp }}</span>
      </app-button>
      <app-button
        [ariaLabel]="t.viewAnom"
        [titleText]="t.viewAnom"
        variant="toggle"
        [active]="state.view() === 'globe' && state.displayMode() === 'anom'"
        (btnClick)="onModeClick('anom')">
        <lucide-icon [img]="activityIcon" [size]="14"></lucide-icon>
        <span class="dock__label">{{ t.viewAnom }}</span>
      </app-button>
      <app-button
        [ariaLabel]="t.viewWalker"
        [titleText]="t.viewWalker"
        variant="toggle"
        [active]="isWalker()"
        (btnClick)="state.setView('walker')">
        <lucide-icon [img]="windIcon" [size]="14"></lucide-icon>
        <span class="dock__label">{{ t.viewWalker }}</span>
      </app-button>
      <app-button
        [ariaLabel]="t.viewImpacts"
        [titleText]="t.viewImpacts"
        variant="toggle"
        [active]="state.view() === 'impacts'"
        (btnClick)="state.setView('impacts')">
        <lucide-icon [img]="cloudRainIcon" [size]="14"></lucide-icon>
        <span class="dock__label">{{ t.viewImpacts }}</span>
      </app-button>
      <app-button
        [ariaLabel]="t.thermoChip"
        [titleText]="t.thermoChip"
        variant="toggle"
        [active]="isThermocline()"
        (btnClick)="state.setView('thermocline')">
        <lucide-icon [img]="wavesIcon" [size]="14"></lucide-icon>
        <span class="dock__label">{{ t.thermoChip }}</span>
      </app-button>
    </div>

    <!-- Row 2: ENSO Timeline Slider + Play Button on the right of the scrollbar -->
    <div class="dock__row dock__row--enso" role="group" [attr.aria-label]="t.ensoTab">
      <app-timeline-slider
        [min]="-2"
        [max]="3"
        [step]="0.05"
        [value]="state.sTarget()"
        [markers]="timelineMarkers()"
        [thumbColor]="state.category().col"
        [ariaLabel]="t.strengthAria"
        (valueChange)="onSliderChange($event)"
        (markerClick)="onMarkerClick($event)">
        <app-button
          timelineAction
          variant="play"
          [iconOnly]="true"
          [active]="state.isPlaying()"
          [ariaLabel]="state.isPlaying() ? t.playStop : t.playStart"
          [titleText]="state.isPlaying() ? t.playStop : t.playStart"
          (btnClick)="state.togglePlaying()">
          @if (state.isPlaying()) {
            <lucide-icon [img]="pauseIcon" [size]="14"></lucide-icon>
          } @else {
            <lucide-icon [img]="playIcon" [size]="14"></lucide-icon>
          }
        </app-button>
      </app-timeline-slider>
    </div>
  </div>
</div>
