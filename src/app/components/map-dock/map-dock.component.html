@let t = i18n.t();

<div #wrap class="dock-wrap">
  <div class="dock glass-panel">
    <!-- Row 1: Status (Live), Phase Badge, Niño 3.4 Readout & Date Lozenge (left), Legend & Glossary (right) -->
    <div class="dock__row dock__row--readout" role="group" [attr.aria-label]="t.readoutTitle">
      <div class="dock__header-group">
        @if (isNow()) {
          <div
            class="dock__status-pill dock__status-pill--live"
            role="status"
            [attr.aria-label]="t.live"
            (click)="onDateClick(1.4)">
            <span class="dock__live-dot" aria-hidden="true"></span>
            <span class="dock__status-text">{{ t.live }}</span>
          </div>
        }

        <div
          class="dock__phase-badge dock__phase-badge--{{ state.category().k }}"
          [style.--phase-accent]="state.category().col"
          role="status">
          <span class="dock__phase-dot" aria-hidden="true"></span>
          <span class="dock__phase-name">{{ state.category().name }}</span>
        </div>

        <div class="dock__readout">
          <span class="dock__readout-label">{{ t.readoutTitle }}</span>
          <span class="dock__readout-val">{{ formattedNino() }}</span>
        </div>

        <div class="dock__date-pill" role="status">
          <span class="dock__date-val">{{ activeDateLabel() }}</span>
        </div>

        <a
          class="dock__source"
          [href]="sourceUrl()"
          target="_blank"
          rel="noopener noreferrer"
          [appTooltip]="t.readoutSource"
          tooltipPlacement="top"
          [attr.aria-label]="t.readoutSource">NOAA</a>
      </div>

      <app-legend-panel></app-legend-panel>
    </div>

    <!-- Row 2: the timeline, full width -->
    <div class="dock__row dock__row--enso" role="group" [attr.aria-label]="t.ensoTab">
      <div class="dock__timeline">
        <app-timeline-slider
          [style.--phase-ticks]="phaseTicks()"
          [min]="-1.8"
          [max]="1.4"
          [step]="0.01"
          [value]="state.sTarget()"
          [thumbColor]="state.category().col"
          [ariaLabel]="t.strengthAria"
          (valueChange)="onSliderChange($event)">
          <div timelineAction class="dock__play">
            <app-dropdown
              class="dock__speed"
              variant="default"
              align="right"
              direction="up"
              [icon]="speedIcon"
              [iconOnly]="true"
              [options]="speedOptions()"
              [value]="state.playbackSpeed()"
              [ariaLabel]="t.playbackSpeed + ' (' + state.playbackSpeed() + 'x)'"
              (valueChange)="state.setPlaybackSpeed($event)">
            </app-dropdown>
            <app-button
              variant="play"
              [iconOnly]="true"
              [active]="state.isPlaying()"
              [ariaLabel]="state.isPlaying() ? t.playStop : t.playStart"
              [titleText]="state.isPlaying() ? t.playStop : t.playStart"
              (btnClick)="state.togglePlaying()">
              @if (state.isPlaying()) {
                <lucide-icon [img]="pauseIcon" [size]="14"></lucide-icon>
              } @else {
                <lucide-icon [img]="playIcon" [size]="14"></lucide-icon>
              }
            </app-button>
          </div>
        </app-timeline-slider>
      </div>
    </div>
  </div>
</div>
