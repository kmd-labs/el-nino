@let t = i18n.t();

<div class="settings">
  <!-- Language Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.changeLanguage }}</h3>
    <div class="settings__group" role="radiogroup" [attr.aria-label]="t.changeLanguage">
      @for (l of languages; track l.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="i18n.lang() === l.id"
          role="radio"
          [attr.aria-checked]="i18n.lang() === l.id"
          (click)="selectLang(l.id)">
          <span class="settings__badge" translate="no">{{ l.id.toUpperCase() }}</span>
          <span class="settings__name">{{ l.label }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Temperature Unit Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.temperatureUnit }}</h3>
    <div class="settings__group" role="radiogroup" [attr.aria-label]="t.temperatureUnit">
      @for (u of tempUnits; track u.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="i18n.tempUnit() === u.id"
          role="radio"
          [attr.aria-checked]="i18n.tempUnit() === u.id"
          (click)="selectTempUnit(u.id)">
          <span class="settings__badge">°{{ u.id }}</span>
          <span class="settings__name">{{ t[u.labelKey] }}</span>
        </button>
      }
    </div>
  </section>
</div>
