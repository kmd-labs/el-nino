@let t = i18n.t();
<aside id="glossary" class="gl glass-panel--heavy" aria-labelledby="gl-title">
  <div class="gl__head">
    <h2 id="gl-title" class="gl__title">{{ t.glTitle }}</h2>
    <app-button variant="ghost" [ariaLabel]="t.close" (btnClick)="close()">×</app-button>
  </div>

  <input
    #search
    class="gl__search"
    type="search"
    [placeholder]="t.glSearch"
    [attr.aria-label]="t.glSearchAria"
    [value]="query()"
    (input)="onSearch($event)" />

  <div class="gl__body">
    @for (g of groups(); track g.title) {
      <section class="gl__group">
        <h3 class="gl__gtitle">{{ g.title }}</h3>
        <dl>
          @for (term of g.terms; track term.term) {
            <div class="gl__item">
              <dt>{{ term.term }}</dt>
              <dd>
                {{ term.text }}
                <a class="gl__wiki" [href]="term.wiki" target="_blank" rel="noopener noreferrer">
                  Wikipedia{{ t.wikiIn[term.wikiLang] }} ↗
                </a>
              </dd>
            </div>
          }
        </dl>
      </section>
    } @empty {
      <p class="gl__empty">{{ t.glEmpty(query()) }}</p>
    }
  </div>
</aside>
