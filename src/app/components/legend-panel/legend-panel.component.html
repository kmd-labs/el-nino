@let t = i18n.t();

<div class="legend-panel">
  <!-- Legend Dropdown (SST / Anomaly Scale Bar, Phase Impacts Pins & Continental Rainfall Anomalies) -->
  <app-dropdown
    variant="ghost"
    direction="up"
    align="right"
    class="legend-panel__legend"
    [icon]="layersIcon"
    [iconOnly]="iconOnly()"
    [label]="t.impactsTab"
    [ariaLabel]="t.impactsTab">
    <div class="legend-panel__dropdown-content">
      <!-- SST / Water Temperature Scale Bar -->
      <div class="legend-panel__group" [appTooltip]="t.scaleSst">
        <div class="legend-panel__section-title">
          {{ t.scaleSstShort }}
        </div>
        <canvas #scaleCanvas class="legend-panel__bar" width="260" height="6"></canvas>
        <div class="legend-panel__ticks">
          @for (v of scaleTicks(); track $index) {
            <span>{{ v }}</span>
          }
        </div>
      </div>

      <!-- Ocean Waves & Wind Circulation Legend -->
      <div class="legend-panel__group legend-panel__group--divider">
        <div class="legend-panel__section-title">{{ t.flowLegendTitle }}</div>
        <div class="legend-panel__items">
          <span class="legend-panel__item legend-panel__item--wind">
            <i aria-hidden="true"></i>{{ t.flowWindLabel }}
          </span>
          <span class="legend-panel__item legend-panel__item--wave">
            <i aria-hidden="true"></i>{{ t.flowWaveLabel }}
          </span>
        </div>
        <p class="legend-panel__flow-desc" [innerHTML]="t.flowDesc | properNouns"></p>
      </div>

      @if (showImpactsLegend()) {
        <!-- Historical Impact Pins Legend -->
        <div class="legend-panel__group legend-panel__group--divider">
          <div class="legend-panel__section-title" [innerHTML]="t.pinLegendTitle(state.category().name) | properNouns"></div>
          <div class="legend-panel__grid">
            <span class="legend-panel__item legend-panel__item--dry"><i></i>{{ t.kindDry }}</span>
            <span class="legend-panel__item legend-panel__item--fire"><i></i>{{ t.kindFire }}</span>
            <span class="legend-panel__item legend-panel__item--wet"><i></i>{{ t.kindWet }}</span>
            <span class="legend-panel__item legend-panel__item--other"><i></i>{{ t.kindOther }}</span>
          </div>
        </div>

        <!-- Continental Rainfall Anomaly Legend -->
        <div class="legend-panel__group legend-panel__group--divider">
          <div class="legend-panel__section-title" [innerHTML]="rainTitle() | properNouns"></div>
          <div class="legend-panel__items">
            <span class="legend-panel__item legend-panel__item--rain-dry">
              <i></i>{{ t.rainDry }}
            </span>
            <span class="legend-panel__item legend-panel__item--rain-wet">
              <i></i>{{ t.rainWet }}
            </span>
          </div>
        </div>
      }
    </div>
  </app-dropdown>

  <span class="legend-panel__divider" aria-hidden="true"></span>

  <app-button
    variant="ghost"
    [iconOnly]="true"
    [ariaLabel]="t.dataSourcesTitle"
    [titleText]="t.dataSourcesTitle"
    (btnClick)="openSourcesPopup()">
    <lucide-icon [img]="databaseIcon" [size]="15"></lucide-icon>
  </app-button>

  <span class="legend-panel__divider" aria-hidden="true"></span>

  <app-button
    variant="ghost"
    [iconOnly]="true"
    [ariaLabel]="t.layerGlossary"
    [titleText]="t.layerGlossaryTitle"
    (btnClick)="openGlossaryPopup()">
    <lucide-icon [img]="bookOpenIcon" [size]="15"></lucide-icon>
  </app-button>
</div>
