@let t = i18n.t();
<div class="impact-events">
  @for (e of filteredEvents(); track $index) {
    <article class="ev">
      <div class="ev__top">
        <app-badge [text]="t.phase[e.ph]" [backgroundColor]="math.getPhaseColor(e.ph)"></app-badge>
        <span class="yrs">{{ e.yrs }}</span>
      </div>

      <dl class="ev__dl">
        @if (e.area) {
          <dt>{{ t.mArea }}</dt>
          <dd [innerHTML]="e.area | properNouns"></dd>
        }
        <dt>{{ t.mAnomaly }}</dt>
        <dd [innerHTML]="e.type | properNouns"></dd>
        <dt>{{ t.mScale }}</dt>
        <dd [innerHTML]="e.aff | properNouns"></dd>
      </dl>

      @if (e.note) {
        <div class="ev__note" [innerHTML]="t.mRole + ' ' + e.note | properNouns"></div>
      }

      <a class="ev__link" [href]="e.src[1]" target="_blank" rel="noopener noreferrer">
        <span>{{ t.mSource }} {{ e.src[0] }}</span>
        <lucide-icon [img]="externalLinkIcon" [size]="13"></lucide-icon>
      </a>
    </article>
  }
</div>
