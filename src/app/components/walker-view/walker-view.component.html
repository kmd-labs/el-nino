@let t = i18n.t();
<section class="walker" [attr.aria-label]="t.walkerAria">
  <div class="walker__step glass-panel" aria-live="polite">
    <span class="walker__badge" [class.walker__badge--cycle]="state.isPlaying()">{{ badge() }}</span>
    <span class="walker__title">{{ caption() }}</span>
  </div>

  <div #box class="walker__box">
    <canvas #cv></canvas>
  </div>

  <div class="walker__foot">
    <div class="walker__ctrl">
      <button type="button" class="wbtn" [attr.aria-label]="t.walkerPrev" (click)="prev()">‹</button>
      <button
        type="button"
        class="wbtn wbtn--play"
        [class.wbtn--on]="playing()"
        [attr.aria-label]="playing() ? t.walkerPause : t.walkerPlay"
        (click)="togglePlay()">
        {{ playing() ? '❚❚' : '▶' }}
      </button>
      <button type="button" class="wbtn" [attr.aria-label]="t.walkerNext" (click)="next()">›</button>
      <div class="walker__dots">
        @for (st of steps; track $index) {
          <button
            type="button"
            class="dot"
            [class.dot--on]="$index === step() && !state.isPlaying()"
            [attr.aria-label]="t.walkerStep($index, t.steps[$index])"
            [title]="t.steps[$index]"
            (click)="pick($index)"></button>
        }
      </div>
    </div>
    <div class="walker__cap">{{ t.walkerCaption }}</div>
  </div>
</section>
