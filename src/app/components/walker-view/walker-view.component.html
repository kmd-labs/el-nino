@let t = i18n.t();
<section class="walker" [attr.aria-label]="t.walkerAria">
  <div class="walker__step glass-panel" aria-live="polite">
    <div class="walker__ctrl">
      <button type="button" class="wbtn" [attr.aria-label]="t.walkerPrev" (click)="prev()">
        <lucide-icon [img]="chevronLeftIcon" [size]="14"></lucide-icon>
      </button>
      <button
        type="button"
        class="wbtn wbtn--play"
        [class.wbtn--on]="playing()"
        [attr.aria-label]="playing() ? t.walkerPause : t.walkerPlay"
        (click)="togglePlay()">
        @if (playing()) {
          <lucide-icon [img]="pauseIcon" [size]="13"></lucide-icon>
        } @else {
          <lucide-icon [img]="playIcon" [size]="13"></lucide-icon>
        }
      </button>
      <button type="button" class="wbtn" [attr.aria-label]="t.walkerNext" (click)="next()">
        <lucide-icon [img]="chevronRightIcon" [size]="14"></lucide-icon>
      </button>
    </div>

    <span class="walker__badge" [class.walker__badge--cycle]="state.isPlaying()">{{ badge() }}</span>
    <span class="walker__title" [innerHTML]="caption() | properNouns"></span>

    <button
      type="button"
      class="wbtn wbtn--info"
      [appTooltip]="t.walkerCaption"
      [attr.aria-label]="t.walkerCaption">
      <lucide-icon [img]="infoIcon" [size]="14"></lucide-icon>
    </button>
  </div>

  <div #box class="walker__box">
    <canvas #cv></canvas>
  </div>
</section>
